name: alkaros

# Local debugging overlay:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait
#
#   http://localhost:8090/         - PosTerminal / WaiterPwa (/waiter) / Cashier (/cashier)
#   http://localhost:8091/display  - customer display (separate origin for B-4)
#   http://localhost:8090/health/ready
#   psql / curl straight to the datastore and api on host ports 5433 / 5080
#
# `web` runs deploy/docker/Caddyfile.dev (bind-mounted): plain HTTP, no
# certificate, X-Forwarded-Proto forced to https upstream, :80 = main origin and
# :81 = customer-display origin. Never deploy this - the core compose.yaml keeps
# everything TLS-only and the ports unpublished on purpose. `http://localhost` is
# still a browser secure context, so the WaiterPwa service worker and offline
# queue work here; reaching this over a LAN IP does not (use the HTTPS 8443 path
# with the CA installed for field tests).

services:
  postgres:
    # 5433 on the host (5432 is often taken by a standalone test-db container).
    ports:
      - "5433:5432"

  api:
    ports:
      - "5080:5080"

  web:
    ports: !override
      - "8090:80"
      - "8091:81"
    volumes:
      - ./deploy/docker/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
