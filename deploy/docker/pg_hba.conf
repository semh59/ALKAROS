# ALKAROS host-based authentication (V1-RMD-095).
#
# Referenced by hba_file in postgresql.tuned.conf. Made explicit so that the
# ops-profile `basebackup` service can open a replication connection and run
# pg_basebackup for point-in-time recovery. Every non-local connection still
# requires a password (scram-sha-256) AND TLS (`hostssl`); `samenet` limits it
# to hosts on the internal compose bridge network (ALKAROS services + on-demand
# ops containers), which is not exposed outside the host. A plain-text
# connection from anywhere but the container's own loopback is refused.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
hostssl all             all             samenet                 scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
hostssl replication     all             samenet                 scram-sha-256
hostnossl all           all             all                     reject
