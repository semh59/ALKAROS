# ALKAROS tuned PostgreSQL 18 configuration (V1-RMD-088).
#
# Loaded by the `postgres` service in compose.yaml via
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
#
# The stock postgres:18 image ships development defaults (shared_buffers 128 MB,
# work_mem 4 MB, random_page_cost 4, jit on). These are the baseline-safe values
# for a dedicated single-restaurant host with 8-16 GB RAM on SSD. Values marked
# "scale with RAM" should be raised on larger dedicated hardware per the table in
# docs/performance/infra-tuning.md. Every non-default line carries its reason.

# --- Connections -----------------------------------------------------------
# This file is passed as the sole config_file, so it must set listen_addresses
# itself; the stock image would otherwise default it to localhost and no other
# container could connect.
listen_addresses = '*'
port = 5432
# Host runs two Npgsql data sources (HostComposition + DualScreenApplication),
# each pooling up to 100. 200 leaves headroom plus room for psql / backup jobs.
max_connections = 200
superuser_reserved_connections = 5

# --- Memory (scale with RAM) --------------------------------------------------
# shared_buffers: ~25% of RAM on a dedicated box. 384 MB suits an 8 GB host and
# is safe when PostgreSQL shares the box; raise to 2-4 GB on a 8-16 GB dedicated
# host. shm_size in compose.yaml must be >= this value.
shared_buffers = 384MB
# effective_cache_size: planner hint for OS + PG cache, ~50-75% of RAM. Not an
# allocation. Higher -> planner favours index scans.
effective_cache_size = 2GB
# Per-sort / per-hash working memory. 4 MB default spills small sorts to disk.
work_mem = 16MB
# Vacuum / index build memory.
maintenance_work_mem = 256MB

# --- Planner: SSD assumptions ----------------------------------------------
# Default random_page_cost = 4 assumes a spinning disk and pushes the planner
# towards sequential scans. On SSD/NVMe random access is nearly as cheap as
# sequential; 1.1 gives correct plans for the OLTP index lookups ALKAROS runs.
random_page_cost = 1.1
effective_io_concurrency = 256

# --- JIT: off for OLTP ----------------------------------------------------
# PostgreSQL's LLVM JIT helps long analytical queries. ALKAROS critical-path
# queries are sub-millisecond point lookups where JIT compilation is pure
# overhead. Off removes that tail latency.
jit = off

# --- Write-ahead log -----------------------------------------------------
# Compress full-page images -> less WAL volume and less disk I/O per commit.
wal_compression = zstd
# Fewer, larger checkpoints; spread the flush over 90% of the interval so a
# checkpoint does not stall order writes at the top of the dinner rush.
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB
# DO NOT set synchronous_commit = off. A POS must not lose a committed order on
# a power cut. Durability stays on; the checkpoint spread above is what protects
# latency.
synchronous_commit = on

# --- Autovacuum: OLTP churn ---------------------------------------------
# orders / kitchen_tickets / bills churn constantly. Vacuum and analyze them
# sooner than the 20% / 10% defaults so plans stay fresh and bloat stays low.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_naptime = 20s
autovacuum_vacuum_cost_limit = 1000

# --- Safety valves -----------------------------------------------------
# Kill a session that holds a transaction open and idle (leaked connection,
# crashed terminal) so it cannot pin vacuum or hold row locks forever.
idle_in_transaction_session_timeout = 60s
# Fail a statement that waits more than 10 s for a lock instead of piling up.
lock_timeout = 10s

# --- Observability -----------------------------------------------------
track_io_timing = on
track_wal_io_timing = on
track_functions = pl
# Operational logging: slow queries, checkpoints, lock waits, autovacuum work.
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_autovacuum_min_duration = 0
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
