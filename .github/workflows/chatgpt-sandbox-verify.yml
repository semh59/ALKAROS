name: chatgpt-sandbox-verify

on:
  push:
    branches:
      - chatgpt/sandbox-verify-20260817
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: .NET + PostgreSQL 18.4 full verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: alkaros_ci_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ALKAROS_TEST_PG_HOST: localhost
      ALKAROS_TEST_PG_PORT: "5432"
      ALKAROS_TEST_PG_USER: postgres
      ALKAROS_TEST_PG_PASSWORD: alkaros_ci_pw
      ALKAROS_DB_PASSWORD: alkaros_ci_pw
      PGPASSWORD: alkaros_ci_pw
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK and .NET 8 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.302
            8.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Record exact sandbox toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sandbox-results/logs
          {
            echo "=== git ==="
            git rev-parse HEAD
            echo "=== dotnet ==="
            dotnet --version
            dotnet --info
            echo "=== psql ==="
            /usr/lib/postgresql/18/bin/psql --version
            echo "=== postgres server ==="
            cid="$(docker ps --filter ancestor=postgres:18.4 --format '{{.ID}}' | head -n 1)"
            test -n "$cid"
            docker exec "$cid" postgres --version
            /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d postgres -Atc "select version();"
          } 2>&1 | tee sandbox-results/logs/toolchain.log

      - name: Restore every project in locked mode
        shell: bash
        run: |
          set -uo pipefail
          fail=0; count=0
          : > sandbox-results/restore-summary.txt
          while IFS= read -r -d '' proj; do
            count=$((count + 1)); safe="$(echo "$proj" | tr '/. ' '___')"
            dotnet restore "$proj" --locked-mode --nologo 2>&1 | tee "sandbox-results/logs/restore-${safe}.log"
            rc=${PIPESTATUS[0]}; echo "$proj rc=$rc" >> sandbox-results/restore-summary.txt
            [ "$rc" -eq 0 ] || fail=1
          done < <(find src tests -type f -name '*.csproj' -print0 | sort -z)
          echo "project_count=$count" | tee -a sandbox-results/restore-summary.txt
          exit "$fail"

      - name: Build every project in Release with warnings as errors
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          fail=0; count=0
          : > sandbox-results/build-summary.txt
          while IFS= read -r -d '' proj; do
            count=$((count + 1)); safe="$(echo "$proj" | tr '/. ' '___')"
            dotnet build "$proj" -c Release --no-restore --warnaserror --nologo 2>&1 | tee "sandbox-results/logs/build-${safe}.log"
            rc=${PIPESTATUS[0]}; echo "$proj rc=$rc" >> sandbox-results/build-summary.txt
            [ "$rc" -eq 0 ] || fail=1
          done < <(find src tests -type f -name '*.csproj' -print0 | sort -z)
          echo "project_count=$count" | tee -a sandbox-results/build-summary.txt
          exit "$fail"

      - name: Run every .NET test project against PostgreSQL 18.4
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p sandbox-results/trx
          fail=0; count=0
          : > sandbox-results/test-summary.txt
          while IFS= read -r -d '' proj; do
            count=$((count + 1)); safe="$(echo "$proj" | tr '/. ' '___')"; outdir="sandbox-results/trx/$safe"
            mkdir -p "$outdir"
            dotnet test "$proj" -c Release --no-build --no-restore --nologo --logger "trx;LogFileName=${safe}.trx" --results-directory "$outdir" 2>&1 | tee "sandbox-results/logs/test-${safe}.log"
            rc=${PIPESTATUS[0]}; echo "$proj rc=$rc" >> sandbox-results/test-summary.txt
            [ "$rc" -eq 0 ] || fail=1
          done < <(find tests -type f -name '*.csproj' -print0 | sort -z)
          echo "test_project_count=$count" | tee -a sandbox-results/test-summary.txt
          exit "$fail"

      - name: Run architecture and governance Python tests
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest tests/Architecture -q --junitxml=sandbox-results/architecture.xml 2>&1 | tee sandbox-results/logs/architecture-tests.log

      - name: Exercise global migration composition against PostgreSQL 18.4
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p sandbox-results/logs sandbox-migrations
          rm -f sandbox-migrations/*
          find database/migrations -type f \( -name '*.up.sql' -o -name '*.down.sql' \) -exec cp {} sandbox-migrations/ \;
          {
            echo "=== flattened migrations ==="
            find sandbox-migrations -maxdepth 1 -type f -printf '%f\n' | sort
            /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS alkaros_sandbox WITH (FORCE);" -c "CREATE DATABASE alkaros_sandbox;"
            dotnet run --project src/Host/ALKAROS.Host.csproj -c Release --no-build -- --order-manifest database/MigrationComposition/order.json --migrations-dir sandbox-migrations --db-url postgresql://postgres@localhost:5432/alkaros_sandbox --psql /usr/lib/postgresql/18/bin/psql
            rc=$?
            echo "host_migration_exit=$rc"
            /usr/lib/postgresql/18/bin/psql -h localhost -U postgres -d alkaros_sandbox -Atc "select schemaname||'.'||tablename from pg_tables where schemaname not in ('pg_catalog','information_schema') order by 1;"
            exit "$rc"
          } 2>&1 | tee sandbox-results/logs/migration-smoke.log
          exit ${PIPESTATUS[0]}

      - name: Aggregate exact test counts
        if: always()
        shell: bash
        run: |
          python - <<'PY' | tee sandbox-results/exact-counts.txt
          import glob, xml.etree.ElementTree as ET
          total=passed=failed=skipped=0
          trx_files=glob.glob('sandbox-results/trx/**/*.trx', recursive=True)
          for f in trx_files:
              root=ET.parse(f).getroot()
              c=root.find('{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}ResultSummary/{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}Counters')
              if c is None:
                  for e in root.iter():
                      if e.tag.endswith('Counters'): c=e; break
              if c is not None:
                  total += int(c.attrib.get('total',0)); passed += int(c.attrib.get('passed',0)); failed += int(c.attrib.get('failed',0))
                  skipped += int(c.attrib.get('notExecuted',0))
          print(f'trx_files={len(trx_files)}')
          print(f'dotnet_total={total}')
          print(f'dotnet_passed={passed}')
          print(f'dotnet_failed={failed}')
          print(f'dotnet_skipped={skipped}')
          try:
              r=ET.parse('sandbox-results/architecture.xml').getroot()
              suites=[r] if r.tag=='testsuite' else list(r.iter('testsuite'))
              if r.tag!='testsuite': suites=[s for s in suites if s is not r]
              if suites:
                  s=suites[0]
                  print(f'python_total={s.attrib.get("tests","?")}')
                  print(f'python_failures={s.attrib.get("failures","?")}')
                  print(f'python_errors={s.attrib.get("errors","?")}')
                  print(f'python_skipped={s.attrib.get("skipped","?")}')
          except Exception as e:
              print(f'python_junit_parse_error={e}')
          PY
          cat sandbox-results/restore-summary.txt | tail -1
          cat sandbox-results/build-summary.txt | tail -1
          cat sandbox-results/test-summary.txt | tail -1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alkaros-chatgpt-sandbox-results-v2
          path: sandbox-results/
          if-no-files-found: error
          retention-days: 7
