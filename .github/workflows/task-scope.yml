name: production-validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      task-id:
        description: "Active Task ID to enforce"
        required: true
        default: "V1-RMD-007"
      diff-base:
        description: "Base ref to diff against (default: repository default branch)"
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  POSTGRES_IMAGE: "postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"

jobs:
  enforce:
    name: Task scope enforcement
    # V1-RMD-394: was windows-latest. Python 3.12.11+ ships no Windows builds (source-only security
    # releases), so once windows-latest moved to Windows Server 2025 setup-python could no longer
    # provide the pinned 3.12.12 and this job failed before running any step. Every step below is
    # already pwsh, which ubuntu-latest ships, and the validate job runs the same 3.12.12 on Ubuntu.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Resolve diff base
        id: base
        shell: pwsh
        # V1-RMD-428: event values reach the script through env, never pasted into its source (a quote in any
        # of them used to end the string and break - or inject into - the script).
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_DIFF_BASE: ${{ github.event.inputs.diff-base }}
        run: |
          $base = $env:PR_BASE_SHA
          if (-not $base) {
            $base = $env:PUSH_BEFORE
          }
          if (-not $base -or $base -match '^0+$') {
            $base = "refs/remotes/origin/$($env:DEFAULT_BRANCH)"
          }
          if ($env:INPUT_DIFF_BASE) {
            $base = $env:INPUT_DIFF_BASE
          }
          "base=$base" >> $env:GITHUB_OUTPUT
      - name: Resolve Task ID(s)
        id: task
        shell: pwsh
        # V1-RMD-428: the PR title/body and the commit message are free text (PR #11's body held a quoted phrase
        # that ended the pasted string and made this step a parse error); they come in through env only.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PUSH_COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          INPUT_TASK_ID: ${{ github.event.inputs.task-id }}
        run: |
          # V1-RMD-321 (independent 2026-09-26 audit, finding K13): this job used to skip itself entirely
          # on a push (`if: github.event_name != 'push'`) - the repository's actual, real-world workflow is
          # a direct push to master, never a pull_request, so Owned-surface enforcement never ran on a
          # single real change in this repo's history. Every source this step can search for a Task ID
          # (PR title/body, or now a push's HEAD commit message) can legitimately name MORE than one -
          # several fixes closed together in one commit, each with its own plan task - so every match is
          # collected, not just the first, and the next step validates the union of their allowlists.
          $taskIds = @()
          if ($env:EVENT_NAME -eq "pull_request") {
            $candidates = @($env:PR_TITLE, $env:PR_BODY)
          } elseif ($env:EVENT_NAME -eq "push") {
            # V1-RMD-454: the diff spans every commit of the push (a merged PR's whole branch), so the IDs
            # of all of them count, not only the merge commit's message.
            $candidates = @($env:HEAD_COMMIT_MESSAGE, $env:PUSH_COMMIT_MESSAGES)
          } else {
            $candidates = @()
          }
          foreach ($candidate in $candidates) {
            if (-not $candidate) { continue }
            $found = [regex]::Matches($candidate, "V\d+-[A-Z]+-\d+")
            foreach ($m in $found) {
              if ($taskIds -notcontains $m.Value) { $taskIds += $m.Value }
            }
          }
          if ($taskIds.Count -eq 0) {
            $taskIds = @($(if ($env:INPUT_TASK_ID) { $env:INPUT_TASK_ID } else { "V1-RMD-007" }))
          }
          "task-ids=$($taskIds -join ',')" >> $env:GITHUB_OUTPUT
      - name: Run task-scope validation
        shell: pwsh
        # V1-RMD-428: both outputs can carry workflow_dispatch input text, so they come in through env too.
        env:
          TASK_IDS: ${{ steps.task.outputs.task-ids }}
          DIFF_BASE: ${{ steps.base.outputs.base }}
        run: |
          # A path only counts as a genuine scope violation when NONE of the referenced tasks' Owned
          # surfaces cover it - each task is validated independently (task_scope_tool.py's own model is
          # one task per run), then the reported out-of-scope paths are intersected across all of them.
          $taskIds = $env:TASK_IDS.Split(",")
          $violationSets = @()
          foreach ($taskId in $taskIds) {
            $raw = python tools/task-scope/task_scope_tool.py `
              --task-id "$taskId" `
              --diff-base "$($env:DIFF_BASE)" `
              --format json
            $parsed = $raw | ConvertFrom-Json
            if ($parsed.metadata_errors.Count -gt 0) {
              Write-Error "Task metadata error for $taskId : $($parsed.metadata_errors -join '; ')"
              exit 1
            }
            $violationSets += @(, ($parsed.findings | ForEach-Object { $_.path }))
          }
          # A plain incrementing loop, not a "1..($n-1)" range slice - that range counts DOWN (to 1,0) and
          # produces an out-of-bounds index when there is only one task id, which behaves inconsistently
          # across PowerShell editions instead of cleanly degenerating to "no other set to intersect with".
          $sharedViolations = $violationSets[0]
          for ($i = 1; $i -lt $violationSets.Count; $i++) {
            $set = $violationSets[$i]
            $sharedViolations = $sharedViolations | Where-Object { $set -contains $_ }
          }
          if ($sharedViolations.Count -gt 0) {
            Write-Error "Scope violations not covered by any of [$($taskIds -join ', ')]: $($sharedViolations -join ', ')"
            exit 1
          }
          Write-Output "OK: every changed path is within scope for at least one of [$($taskIds -join ', ')]"
          # V1-RMD-394: the Actions pwsh wrapper exits with $LASTEXITCODE, i.e. the last task_scope_tool.py
          # run - which is 1 whenever that ONE task alone has findings, even though the intersection above
          # just proved another task covers every one of them. The verdict is the intersection, so exit 0.
          exit 0

  validate:
    name: Locked build, tests and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.419
            10.0.302
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.7"
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "11.19.0"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/Clients/PosTerminal/pnpm-lock.yaml
          package-manager-cache: false
      - name: Verify exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.302"
          test "$(python --version 2>&1)" = "Python 3.12.12"
          test "$(pnpm --version)" = "11.19.0"
          node --version | grep -E '^v24\.'
          uv --version | grep -F 'uv 0.10.7'
      - name: Validate plan, PDF trace and project manifest
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py validate
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py validate-coverage
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py verify-manifest
          python -B tools/project-manifest/project_manifest_tool.py
      - name: Root Markdown lint
        shell: bash
        run: pnpm dlx --package=markdownlint-cli2@0.23.2 markdownlint-cli2
      - name: Locked frontend install, tests and production build
        working-directory: src/Clients/PosTerminal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Node contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/tests/run_e2e_browser_test.test.js
      - name: Python architecture tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            --with pytest python -m pytest tests/Architecture -q
      - name: Locked .NET restore and Release build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ALKAROS.slnx --locked-mode
          dotnet build ALKAROS.slnx --configuration Release --no-restore
      - name: Verify build provenance positive and negative paths
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/build-provenance/verify_build_provenance.py
          if python -B tools/build-provenance/verify_build_provenance.py \
            --candidate-sha 0000000000000000000000000000000000000000; then
            echo "Wrong candidate SHA was accepted" >&2
            exit 1
          fi
          if dotnet build ALKAROS.slnx --configuration Release --no-restore \
            -p:RepositoryCommit=0000000000000000000000000000000000000000; then
            echo "Wrong RepositoryCommit override was accepted" >&2
            exit 1
          fi
      - name: Start digest-pinned PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ALKAROS_TEST_PG_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name alkaros-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD="$password" \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec alkaros-ci-postgres pg_isready --username postgres --dbname postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs alkaros-ci-postgres >&2
          exit 1
      - name: Install isolated psql 18 wrapper
        shell: bash
        run: |
          sudo tee /usr/local/bin/psql >/dev/null <<'EOF'
          #!/usr/bin/env bash
          # The migration/history tests write fixture .sql scripts to the host
          # temp dir (Path.GetTempPath() -> /tmp) and pass absolute paths to
          # `psql --file`, so the container has to see /tmp as well as the repo.
          exec docker run --rm --network host \
            -e PGPASSWORD \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "/tmp:/tmp:ro" \
            -w "$GITHUB_WORKSPACE" \
            postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 \
            psql "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/psql
          psql --version
      - name: Install isolated pg_dump and pg_restore 18 wrappers
        shell: bash
        run: |
          # V1-RMD-266: the restore-drill tests write a real custom-format dump
          # (pg_dump) and restore it (pg_restore); the runner's own client is
          # v16 and refuses a v18 server. /tmp is writable and files are owned
          # by the runner user so the tests can clean up after themselves.
          for tool in pg_dump pg_restore; do
            printf '%s\n' '#!/usr/bin/env bash' \
              'exec docker run --rm --network host --user "$(id -u):$(id -g)" -e PGPASSWORD -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v /tmp:/tmp -w "$GITHUB_WORKSPACE" postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 '"$tool"' "$@"' \
              | sudo tee "/usr/local/bin/$tool" >/dev/null
            sudo chmod 0755 "/usr/local/bin/$tool"
          done
          pg_dump --version
          pg_restore --version
      - name: Full .NET tests with line and branch coverage measurement
        shell: bash
        run: |
          # V1-RMD-394: Actions runs `shell: bash` as `bash -e`, and `set -uo pipefail` never turned -e
          # off - so the first failing project aborted the step and the per-project loop below never
          # collected the rest (run 36394844650 stopped after 5 of ~147 projects). The loop records
          # every failure itself and exits 1 at the end.
          set +e
          set -uo pipefail
          dotnet tool install --global dotnet-coverage --version 18.10.0
          # V1-RMD-197: found on the first two real runs of this step ever
          # (9+ days of prior pushes never reached it - V1-RMD-194/195
          # opened the gates ahead of it; V1-RMD-196 added the diagnostics
          # that proved this). Wrapping the ENTIRE solution's `dotnet test
          # ALKAROS.slnx` in one `dotnet-coverage collect` session held
          # ~90 test projects' live coverage data in memory for one final
          # merge; that merge never completed - no diagnostic output at
          # all appeared between dotnet-coverage's own "Code coverage
          # results: ..." line and the step's bare failure, on either run,
          # meaning the process was killed from outside normal shell
          # control (this session's own machine hit the identical OOM
          # trying to reproduce the same single giant collect locally,
          # twice). Collecting per test project and merging the resulting
          # (already-flushed-to-disk) files afterward keeps only one
          # project's coverage session live in memory at a time - the
          # merge step then combines completed XML files, a far lighter
          # operation than merging live sessions.
          mkdir -p "$RUNNER_TEMP/coverage-parts" "$RUNNER_TEMP/test-results"
          failed_projects=""
          while IFS= read -r project; do
            project_name=$(basename "$project" .csproj)
            echo "::group::Coverage: $project_name"
            dotnet-coverage collect \
              "dotnet test \"$project\" --configuration Release --no-build --logger trx --results-directory $RUNNER_TEMP/test-results" \
              --output "$RUNNER_TEMP/coverage-parts/$project_name.cobertura.xml" \
              --output-format cobertura
            project_exit=$?
            echo "::endgroup::"
            if [ "$project_exit" -ne 0 ]; then
              echo "FAILED ($project_exit): $project_name"
              failed_projects="$failed_projects $project_name"
            fi
          done < <(find tests -name "*.Tests.csproj" | sort)
          if [ -n "$failed_projects" ]; then
            echo "One or more test projects failed:$failed_projects"
            exit 1
          fi
          echo "Coverage part files:"
          ls -la "$RUNNER_TEMP/coverage-parts" || true
          dotnet-coverage merge "$RUNNER_TEMP"/coverage-parts/*.cobertura.xml \
            --output "$RUNNER_TEMP/coverage.cobertura.xml" \
            --output-format cobertura
          merge_exit=$?
          echo "dotnet-coverage merge exit code: $merge_exit"
          echo "Disk space:"
          df -h "$RUNNER_TEMP" || true
          echo "Merged coverage output file:"
          ls -la "$RUNNER_TEMP/coverage.cobertura.xml" 2>&1 || echo "  (does not exist)"
          if [ "$merge_exit" -ne 0 ]; then
            echo "dotnet-coverage merge failed (exit $merge_exit)."
            exit "$merge_exit"
          fi
          if [ ! -s "$RUNNER_TEMP/coverage.cobertura.xml" ]; then
            echo "Merged coverage file is missing or empty despite a successful merge exit code."
            exit 1
          fi
          python - "$RUNNER_TEMP/coverage.cobertura.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          print("line-rate=" + root.attrib["line-rate"])
          print("branch-rate=" + root.attrib["branch-rate"])
          PY
      - name: Dependency vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          # V1-RMD-337 (independent 2026-09-26 audit, orta seviye bulgu): `dotnet list
          # package --vulnerable` always exits 0, even when it finds vulnerable packages -
          # it only ever prints them. The command below never failed this step on its own;
          # only pnpm audit's own real exit code (unaffected by this finding) did. --format
          # json is parsed explicitly instead of grepping the human-readable text, which is
          # localized (this SDK prints Turkish on a tr-TR host) and would silently stop
          # matching under a different locale.
          dotnet list ALKAROS.slnx package --vulnerable --include-transitive --format json \
            > "$RUNNER_TEMP/vulnerable-packages.json"
          python - "$RUNNER_TEMP/vulnerable-packages.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          vulnerable = []
          for project in data.get("projects", []):
              for framework in project.get("frameworks", []):
                  for key in ("topLevelPackages", "transitivePackages"):
                      for package in framework.get(key) or []:
                          if package.get("vulnerabilities"):
                              vulnerable.append((project["path"], package["id"], package.get("resolvedVersion")))

          if vulnerable:
              print("Vulnerable NuGet packages found:")
              for path, package_id, version in vulnerable:
                  print(f"  {path}: {package_id} {version}")
              sys.exit(1)
          print("No vulnerable NuGet packages found.")
          PY
          pnpm --dir src/Clients/PosTerminal audit --prod --audit-level high
      - name: SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          mkdir -p "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/licenses"
          sbom-tool generate \
            -b . \
            -bc . \
            -pn ALKAROS \
            -pv 1.0.0 \
            -ps ALKAROS \
            -nsb https://alkaros.invalid/sbom \
            -m "$RUNNER_TEMP/sbom"
          find "$RUNNER_TEMP/sbom" -type f -size +0c -print -quit | grep -q .
          pnpm --dir src/Clients/PosTerminal licenses list --prod --json \
            > "$RUNNER_TEMP/licenses/pnpm-production-licenses.json"
          test -s "$RUNNER_TEMP/licenses/pnpm-production-licenses.json"
      - name: Full Git history secret scan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force alkaros-ci-postgres >/dev/null 2>&1 || true

  e2e:
    name: Cashier and WaiterPwa browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.419
            10.0.302
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: "11.19.0"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/Clients/PosTerminal/pnpm-lock.yaml
          package-manager-cache: false
      - name: Build PosTerminal
        working-directory: src/Clients/PosTerminal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build Host in Debug
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Host/ALKAROS.Host.csproj --locked-mode
          dotnet build src/Host/ALKAROS.Host.csproj --configuration Debug --no-restore
          test -f src/Host/bin/Debug/net8.0/ALKAROS.Host.dll
      - name: Start digest-pinned PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ALKAROS_TEST_PG_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name alkaros-e2e-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD="$password" \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec alkaros-e2e-postgres pg_isready --username postgres --dbname postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs alkaros-e2e-postgres >&2
          exit 1
      - name: Install E2E dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          for suite in Cashier WaiterPwa; do
            npm ci --prefix "tests/E2E/$suite"
          done
          npx --prefix tests/E2E/Cashier playwright install --with-deps chromium
      - name: Cashier E2E
        working-directory: tests/E2E/Cashier
        shell: bash
        env:
          ALKAROS_TEST_PG_HOST: localhost
          ALKAROS_TEST_PG_PORT: "5432"
        run: |
          set -euo pipefail
          DOTNET_EXE="$(command -v dotnet)" npx playwright test
      - name: WaiterPwa E2E
        if: success() || failure()
        working-directory: tests/E2E/WaiterPwa
        shell: bash
        env:
          ALKAROS_TEST_PG_HOST: localhost
          ALKAROS_TEST_PG_PORT: "5432"
        run: |
          set -euo pipefail
          DOTNET_EXE="$(command -v dotnet)" npx playwright test
      - name: Upload E2E reports and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-reports
          path: |
            tests/E2E/*/report
            tests/E2E/*/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force alkaros-e2e-postgres >/dev/null 2>&1 || true
