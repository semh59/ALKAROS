name: task-scope

on:
  pull_request:
  workflow_dispatch:
    inputs:
      task-id:
        description: "Active Task ID to enforce"
        required: true
        default: "V1-FND-007"
      diff-base:
        description: "Base ref to diff against (default: repository default branch)"
        required: false

permissions:
  contents: read

jobs:
  enforce:
    name: Task scope enforcement
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve diff base
        id: base
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) {
            $base = "refs/remotes/origin/${{ github.event.repository.default_branch }}"
          }
          if ("${{ github.event.inputs.diff-base }}" -ne "") {
            $base = "${{ github.event.inputs.diff-base }}"
          }
          "base=$base" >> $env:GITHUB_OUTPUT
      - name: Resolve Task ID
        id: task
        shell: pwsh
        run: |
          $taskId = "${{ github.event.inputs.task-id || 'V1-FND-007' }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $candidates = @(
              "${{ github.event.pull_request.title }}",
              "${{ github.event.pull_request.body }}"
            )
            foreach ($c in $candidates) {
              if ($c -match "V\d+-[A-Z]+-\d+") {
                $taskId = $matches[0]
                break
              }
            }
          }
          "task-id=$taskId" >> $env:GITHUB_OUTPUT
      - name: Run task-scope validation
        shell: pwsh
        run: |
          python tools/task-scope/task_scope_tool.py `
            --task-id "${{ steps.task.outputs.task-id }}" `
            --diff-base "${{ steps.base.outputs.base }}" `
            --format text
