name: production-validation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      task-id:
        description: "Active Task ID to enforce"
        required: true
        default: "V1-RMD-007"
      diff-base:
        description: "Base ref to diff against (default: repository default branch)"
        required: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  POSTGRES_IMAGE: "postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2"

jobs:
  enforce:
    name: Task scope enforcement
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - name: Resolve diff base
        id: base
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) {
            $base = "${{ github.event.before }}"
          }
          if (-not $base -or $base -match '^0+$') {
            $base = "refs/remotes/origin/${{ github.event.repository.default_branch }}"
          }
          if ("${{ github.event.inputs.diff-base }}" -ne "") {
            $base = "${{ github.event.inputs.diff-base }}"
          }
          "base=$base" >> $env:GITHUB_OUTPUT
      - name: Resolve Task ID
        id: task
        shell: pwsh
        run: |
          $taskId = "${{ github.event.inputs.task-id || 'V1-RMD-007' }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $candidates = @(
              "${{ github.event.pull_request.title }}",
              "${{ github.event.pull_request.body }}"
            )
            foreach ($candidate in $candidates) {
              if ($candidate -match "V\d+-[A-Z]+-\d+") {
                $taskId = $matches[0]
                break
              }
            }
          }
          "task-id=$taskId" >> $env:GITHUB_OUTPUT
      - name: Run task-scope validation
        shell: pwsh
        run: |
          python tools/task-scope/task_scope_tool.py `
            --task-id "${{ steps.task.outputs.task-id }}" `
            --diff-base "${{ steps.base.outputs.base }}" `
            --format text

  validate:
    name: Locked build, tests and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.419
            10.0.302
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: "11.19.0"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/Clients/PosTerminal/pnpm-lock.yaml
          package-manager-cache: false
      - name: Verify exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.302"
          test "$(python --version 2>&1)" = "Python 3.12.12"
          test "$(pnpm --version)" = "11.19.0"
          node --version | grep -E '^v24\.'
          uv --version | grep -F 'uv 0.10.7'
      - name: Validate plan, PDF trace and project manifest
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py validate
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py validate-coverage
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            python -B tools/plan-audit/plan_audit_tool.py verify-manifest
          python -B tools/project-manifest/project_manifest_tool.py
      - name: Root Markdown lint
        shell: bash
        run: pnpm dlx --package=markdownlint-cli2@0.23.2 markdownlint-cli2
      - name: Locked frontend install, tests and production build
        working-directory: src/Clients/PosTerminal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Node contract tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/tests/run_e2e_browser_test.test.js
      - name: Python architecture tests
        shell: bash
        run: |
          set -euo pipefail
          uv run --python 3.12.12 --with-requirements plan/validation-requirements.lock \
            --with pytest python -m pytest tests/Architecture -q
      - name: Locked .NET restore and Release build
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore ALKAROS.slnx --locked-mode
          dotnet build ALKAROS.slnx --configuration Release --no-restore
      - name: Verify build provenance positive and negative paths
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/build-provenance/verify_build_provenance.py
          if python -B tools/build-provenance/verify_build_provenance.py \
            --candidate-sha 0000000000000000000000000000000000000000; then
            echo "Wrong candidate SHA was accepted" >&2
            exit 1
          fi
          if dotnet build ALKAROS.slnx --configuration Release --no-restore \
            -p:RepositoryCommit=0000000000000000000000000000000000000000; then
            echo "Wrong RepositoryCommit override was accepted" >&2
            exit 1
          fi
      - name: Start digest-pinned PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ALKAROS_TEST_PG_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name alkaros-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD="$password" \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec alkaros-ci-postgres pg_isready --username postgres --dbname postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs alkaros-ci-postgres >&2
          exit 1
      - name: Install isolated psql 18 wrapper
        shell: bash
        run: |
          sudo tee /usr/local/bin/psql >/dev/null <<'EOF'
          #!/usr/bin/env bash
          # The migration/history tests write fixture .sql scripts to the host
          # temp dir (Path.GetTempPath() -> /tmp) and pass absolute paths to
          # `psql --file`, so the container has to see /tmp as well as the repo.
          exec docker run --rm --network host \
            -e PGPASSWORD \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "/tmp:/tmp:ro" \
            -w "$GITHUB_WORKSPACE" \
            postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 \
            psql "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/psql
          psql --version
      - name: Install isolated pg_dump and pg_restore 18 wrappers
        shell: bash
        run: |
          # V1-RMD-266: the restore-drill tests write a real custom-format dump
          # (pg_dump) and restore it (pg_restore); the runner's own client is
          # v16 and refuses a v18 server. /tmp is writable and files are owned
          # by the runner user so the tests can clean up after themselves.
          for tool in pg_dump pg_restore; do
            printf '%s\n' '#!/usr/bin/env bash' \
              'exec docker run --rm --network host --user "$(id -u):$(id -g)" -e PGPASSWORD -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -v /tmp:/tmp -w "$GITHUB_WORKSPACE" postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2 '"$tool"' "$@"' \
              | sudo tee "/usr/local/bin/$tool" >/dev/null
            sudo chmod 0755 "/usr/local/bin/$tool"
          done
          pg_dump --version
          pg_restore --version
      - name: Full .NET tests with line and branch coverage measurement
        shell: bash
        run: |
          set -uo pipefail
          dotnet tool install --global dotnet-coverage --version 18.10.0
          # V1-RMD-197: found on the first two real runs of this step ever
          # (9+ days of prior pushes never reached it - V1-RMD-194/195
          # opened the gates ahead of it; V1-RMD-196 added the diagnostics
          # that proved this). Wrapping the ENTIRE solution's `dotnet test
          # ALKAROS.slnx` in one `dotnet-coverage collect` session held
          # ~90 test projects' live coverage data in memory for one final
          # merge; that merge never completed - no diagnostic output at
          # all appeared between dotnet-coverage's own "Code coverage
          # results: ..." line and the step's bare failure, on either run,
          # meaning the process was killed from outside normal shell
          # control (this session's own machine hit the identical OOM
          # trying to reproduce the same single giant collect locally,
          # twice). Collecting per test project and merging the resulting
          # (already-flushed-to-disk) files afterward keeps only one
          # project's coverage session live in memory at a time - the
          # merge step then combines completed XML files, a far lighter
          # operation than merging live sessions.
          mkdir -p "$RUNNER_TEMP/coverage-parts" "$RUNNER_TEMP/test-results"
          failed_projects=""
          while IFS= read -r project; do
            project_name=$(basename "$project" .csproj)
            echo "::group::Coverage: $project_name"
            dotnet-coverage collect \
              "dotnet test \"$project\" --configuration Release --no-build --logger trx --results-directory $RUNNER_TEMP/test-results" \
              --output "$RUNNER_TEMP/coverage-parts/$project_name.cobertura.xml" \
              --output-format cobertura
            project_exit=$?
            echo "::endgroup::"
            if [ "$project_exit" -ne 0 ]; then
              echo "FAILED ($project_exit): $project_name"
              failed_projects="$failed_projects $project_name"
            fi
          done < <(find tests -name "*.Tests.csproj" | sort)
          if [ -n "$failed_projects" ]; then
            echo "One or more test projects failed:$failed_projects"
            exit 1
          fi
          echo "Coverage part files:"
          ls -la "$RUNNER_TEMP/coverage-parts" || true
          dotnet-coverage merge "$RUNNER_TEMP"/coverage-parts/*.cobertura.xml \
            --output "$RUNNER_TEMP/coverage.cobertura.xml" \
            --output-format cobertura
          merge_exit=$?
          echo "dotnet-coverage merge exit code: $merge_exit"
          echo "Disk space:"
          df -h "$RUNNER_TEMP" || true
          echo "Merged coverage output file:"
          ls -la "$RUNNER_TEMP/coverage.cobertura.xml" 2>&1 || echo "  (does not exist)"
          if [ "$merge_exit" -ne 0 ]; then
            echo "dotnet-coverage merge failed (exit $merge_exit)."
            exit "$merge_exit"
          fi
          if [ ! -s "$RUNNER_TEMP/coverage.cobertura.xml" ]; then
            echo "Merged coverage file is missing or empty despite a successful merge exit code."
            exit 1
          fi
          python - "$RUNNER_TEMP/coverage.cobertura.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          print("line-rate=" + root.attrib["line-rate"])
          print("branch-rate=" + root.attrib["branch-rate"])
          PY
      - name: Dependency vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          dotnet list ALKAROS.slnx package --vulnerable --include-transitive
          pnpm --dir src/Clients/PosTerminal audit --prod --audit-level high
      - name: SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.Sbom.DotNetTool --version 4.1.5
          mkdir -p "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/licenses"
          sbom-tool generate \
            -b . \
            -bc . \
            -pn ALKAROS \
            -pv 1.0.0 \
            -ps ALKAROS \
            -nsb https://alkaros.invalid/sbom \
            -m "$RUNNER_TEMP/sbom"
          find "$RUNNER_TEMP/sbom" -type f -size +0c -print -quit | grep -q .
          pnpm --dir src/Clients/PosTerminal licenses list --prod --json \
            > "$RUNNER_TEMP/licenses/pnpm-production-licenses.json"
          test -s "$RUNNER_TEMP/licenses/pnpm-production-licenses.json"
      - name: Full Git history secret scan
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force alkaros-ci-postgres >/dev/null 2>&1 || true

  e2e:
    name: Cashier and WaiterPwa browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.419
            10.0.302
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: "11.19.0"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/Clients/PosTerminal/pnpm-lock.yaml
          package-manager-cache: false
      - name: Build PosTerminal
        working-directory: src/Clients/PosTerminal
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build Host in Debug
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Host/ALKAROS.Host.csproj --locked-mode
          dotnet build src/Host/ALKAROS.Host.csproj --configuration Debug --no-restore
          test -f src/Host/bin/Debug/net8.0/ALKAROS.Host.dll
      - name: Start digest-pinned PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "ALKAROS_TEST_PG_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run --detach --name alkaros-e2e-postgres \
            --publish 5432:5432 \
            --env POSTGRES_PASSWORD="$password" \
            "$POSTGRES_IMAGE"
          for attempt in $(seq 1 60); do
            if docker exec alkaros-e2e-postgres pg_isready --username postgres --dbname postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs alkaros-e2e-postgres >&2
          exit 1
      - name: Install E2E dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          for suite in Cashier WaiterPwa; do
            npm ci --prefix "tests/E2E/$suite"
          done
          npx --prefix tests/E2E/Cashier playwright install --with-deps chromium
      - name: Cashier E2E
        working-directory: tests/E2E/Cashier
        shell: bash
        env:
          ALKAROS_TEST_PG_HOST: localhost
          ALKAROS_TEST_PG_PORT: "5432"
        run: |
          set -euo pipefail
          DOTNET_EXE="$(command -v dotnet)" npx playwright test
      - name: WaiterPwa E2E
        if: success() || failure()
        working-directory: tests/E2E/WaiterPwa
        shell: bash
        env:
          ALKAROS_TEST_PG_HOST: localhost
          ALKAROS_TEST_PG_PORT: "5432"
        run: |
          set -euo pipefail
          DOTNET_EXE="$(command -v dotnet)" npx playwright test
      - name: Upload E2E reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            tests/E2E/*/report
            tests/E2E/*/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force alkaros-e2e-postgres >/dev/null 2>&1 || true
