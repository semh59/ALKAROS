name: alkaros

# Core stack, brought up with:
#   docker compose up --detach --build --wait
#
# Frontend / backend split (A1):
#   web   - Caddy: static bundles (PosTerminal SPA, WaiterPwa, Cashier) + TLS +
#           reverse proxy of /api, /hubs, /health to the api service
#   api   - ALKAROS.Host serve --api-only: JSON API + SignalR hubs, plain HTTP
#   postgres, migrate, provision - datastore and one-shot bootstrap jobs
#
# Operator maintenance tools (backup / PITR / housekeeping) live in
# compose.ops.yaml and are never started by `up`:
#   docker compose -f compose.yaml -f compose.ops.yaml run --rm backup
# Local debugging (publish db + api ports) is compose.dev.yaml:
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# Running the .NET test suite against a real, disposable PostgreSQL (no host
# psql/Postgres dependency) is compose.test.yaml:
#   docker compose -f compose.yaml -f compose.test.yaml run --build --rm test

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    # Load the tuned config (V1-RMD-088). See docs/performance/infra-tuning.md
    # for the rationale and how to resize shared_buffers / effective_cache_size
    # for the actual deployment host.
    # The entrypoint wrapper runs as root (before the image drops to the postgres
    # user) so it can give the named alkaros-wal-archive volume to postgres for
    # the archive_command (V1-RMD-095); Docker creates named volumes root-owned.
    entrypoint:
      - "bash"
      - "-c"
      - 'install -d -o postgres -g postgres -m 750 /wal-archive && exec docker-entrypoint.sh "$@"'
      - "--"
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    environment:
      POSTGRES_DB: alkaros
      POSTGRES_USER: alkaros
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    # Must be >= shared_buffers in postgresql.tuned.conf.
    shm_size: 512mb
    volumes:
      - alkaros-postgres:/var/lib/postgresql
      - alkaros-wal-archive:/wal-archive
      - ./deploy/docker/postgresql.tuned.conf:/etc/postgresql/postgresql.conf:ro
      - ./deploy/docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alkaros -d alkaros"]
      interval: 5s
      timeout: 5s
      retries: 20
    # V12-QRT-005: also on `relay-internal` so `connector` (which joins only
    # that one network, deliberately, to avoid the DNS ambiguity of sharing
    # two networks with `api` - Docker's embedded DNS does not consistently
    # pick the network you want when a name resolves on more than one) can
    # still reach `postgres` without ever needing `default`.
    networks:
      default: {}
      relay-internal: {}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2g
        reservations:
          cpus: "1.0"
          memory: 768m

  migrate:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: api
    entrypoint: ["/bin/sh", "-eu", "-c"]
    secrets: [db_password]
    depends_on:
      postgres: { condition: service_healthy }
    command:
      - |
        export ALKAROS_DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/db_password)"
        exec dotnet ALKAROS.Host.dll --order-manifest /app/database/MigrationComposition/order.json --migrations-dir /app/database/migrations --db-url postgresql://alkaros@postgres:5432/alkaros
    restart: "no"

  provision:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: api
    environment:
      ALKAROS_BOOTSTRAP_USERNAME: ${ALKAROS_BOOTSTRAP_USERNAME:-admin}
      ALKAROS_BOOTSTRAP_DISPLAY_NAME: ${ALKAROS_BOOTSTRAP_DISPLAY_NAME:-ALKAROS Manager}
    entrypoint: ["/bin/sh", "-eu", "-c"]
    secrets: [db_password, admin_password]
    depends_on:
      migrate: { condition: service_completed_successfully }
    command:
      - |
        export ALKAROS_DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/db_password)"
        export ALKAROS_BOOTSTRAP_PASSWORD="$$(tr -d '\r\n' < /run/secrets/admin_password)"
        exec dotnet ALKAROS.Host.dll provision-manager --db-url postgresql://alkaros@postgres:5432/alkaros
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: api
    environment:
      ALKAROS_KITCHEN_STATION_ID: ${ALKAROS_KITCHEN_STATION_ID:-kitchen-main}
      # Absolute origin the browser reaches the customer display on (the `web`
      # display vhost, published on 8443). runtime-configuration hands this to
      # the cashier so the "customer display" link opens the isolated origin
      # (finding B-4). Update the :8443 if you remap the web port.
      ALKAROS_CUSTOMER_DISPLAY_ORIGIN_URL: https://display.${ALKAROS_PROXY_HOST:-localhost}:8443
      # V12-QRT-003: AES-256-GCM envelope master key (`ALKAROS.Secrets.
      # EnvironmentVariableSecretProvider`) for the relay credential/tunnel
      # stores. Never a literal value here — set it in a local, gitignored
      # `.env` file (`openssl rand -base64 32`). Losing it makes any
      # already-saved relay credential unreadable.
      ALKAROS_SECRET_ENVELOPE_MASTER_KEY: ${ALKAROS_SECRET_ENVELOPE_MASTER_KEY:?Set ALKAROS_SECRET_ENVELOPE_MASTER_KEY in a local .env file (openssl rand -base64 32)}
      # .NET runtime tuning (V1-RMD-088). Server GC + a background thread per
      # core suits a throughput service; dynamic adaptation right-sizes the heap
      # when the container memory limit is small; TieredPGO improves hot-path
      # codegen after warmup.
      DOTNET_gcServer: "1"
      DOTNET_GCDynamicAdaptationMode: "1"
      DOTNET_TieredPGO: "1"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        export ALKAROS_DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/db_password)"
        # --api-only: no static file pipeline, no --web-root; `web` serves the
        # bundles. --customer-display-origin-header is the proxy-mode B-4 origin
        # signal (Caddy sets X-Alkaros-Origin: display on the display vhost).
        # --nfc-loopback-origin (relay scope hardening, 2026-09-09): kept for
        # a genuine loopback caller (e.g. local debugging) - without some form
        # of this gate, a provisioned tunnel would expose the ENTIRE app
        # (every Cashier/manager API included) to the public internet,
        # protected by nothing but the app's own auth.
        # --nfc-trusted-network (V12-QRT-005): the connector now runs in its
        # own container (ALKAROS.QrRelay.LocalConnector, see the `connector`
        # service below), reaching this port over the dedicated
        # `relay-internal` network instead of loopback - this is that
        # network's own subnet, so the NFC/QR customer route allowlist gate
        # still applies to it, same reasoning as the loopback flag above.
        # Both restrict the request to the NFC/QR customer route allowlist,
        # the same way the display vhost is already restricted above.
        # --qr-web-root (V12-CWB-001) / --nfc-web-root (V1-RMD-141): the QR
        # and NFC customer pages' own static bundles, baked into this image
        # at /app/qr-web and /app/nfc-web - the tunnel above never reaches
        # `web` (Caddy) at all, so this process is the only thing that can
        # ever serve either to a relay-connected customer.
        # --nfc-origin-header (V1-RMD-142): the LAN counterpart to
        # --nfc-loopback-origin - Caddy's own nfc.<ALKAROS_PROXY_HOST> vhost
        # tags its proxied /api/v1/nfc|qr/* requests X-Alkaros-Origin: nfc,
        # so a customer on the restaurant's own WiFi reaches the same
        # isolated surface a relay-connected customer does.
        exec dotnet ALKAROS.Host.dll serve --db-url postgresql://alkaros@postgres:5432/alkaros --urls 'http://0.0.0.0:5080' --api-only --customer-display-origin-header X-Alkaros-Origin --nfc-loopback-origin --nfc-trusted-network 172.28.90.0/28 --nfc-origin-header X-Alkaros-Origin --qr-web-root /app/qr-web --nfc-web-root /app/nfc-web --trusted-network 172.16.0.0/12
    secrets: [db_password]
    depends_on:
      provision: { condition: service_completed_successfully }
    networks:
      default: {}
      # V12-QRT-005: the small, dedicated network the `connector` service
      # also joins below - see DualScreenOptions.NfcTrustedNetworks's own
      # doc comment for why this narrower network (not the generic
      # `default`/--trusted-network 172.16.0.0/12 range) is what the NFC
      # relay transport-exemption gate actually checks against.
      relay-internal: {}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:5080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 1536m
        reservations:
          cpus: "1.0"
          memory: 512m

  connector:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: connector
    secrets: [db_password]
    depends_on:
      api: { condition: service_healthy }
    # V12-QRT-005: an independent container on the compose network (its own
    # network namespace), NOT `network_mode: "service:api"` — that was tried
    # first and rejected: sharing api's network namespace meant restarting
    # `api` also forced the connector to restart (Docker tears down and
    # recreates the namespace, which every joiner shares), defeating half of
    # this task's own point (a routine API deploy would still drop the
    # public QR ordering path). `cloudflared`'s tunnel ingress target is now
    # `http://api:5080` (RelayProvisioningService.LocalOriginService) — the
    # compose service DNS name — instead of "localhost". See
    # docs/architecture/qr-relay-topology.md's V12-QRT-005 amendment note:
    # still no public inbound port, still the same physical host, still
    # API-key authenticated; only the internal reachability mechanism
    # changed from OS loopback to the compose bridge network.
    #
    # Only `relay-internal`, deliberately not `default` too: `postgres` also
    # joins `relay-internal` (see its own service block) specifically so
    # this container needs exactly one shared network with each of `api`
    # and `postgres` - sharing two networks with the same peer makes
    # Docker's embedded DNS resolution of that peer's name ambiguous
    # (confirmed: it does not reliably return the `relay-internal` address
    # when `api` is reachable on both `default` and `relay-internal`, which
    # defeats DualScreenOptions.NfcTrustedNetworks's whole point).
    networks:
      relay-internal: {}
    command:
      - |
        export ALKAROS_DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/db_password)"
        exec dotnet ALKAROS.QrRelay.ConnectorHost.dll --db-url postgresql://alkaros@postgres:5432/alkaros
    entrypoint: ["/bin/sh", "-eu", "-c"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: web
    # V1-RMD-192: found while inspecting the running container - caddy runs
    # as PID 1 with no init process, so it never reaps a zombie. The
    # healthcheck below (wget --spider https://...) forks a busybox
    # ssl_client helper for the TLS handshake on every single check; that
    # helper's zombie was never reaped, and 10s * (uptime) of them had piled
    # up (10,643 zombies after ~30h uptime, /proc/*/status confirmed State:
    # Z on every one, cgroup pids.max was "max" - no ceiling at all). `init:
    # true` makes Docker run its bundled tini as PID 1 instead, which does
    # reap every zombie a health check (or anything else) leaves behind.
    init: true
    environment:
      # LAN hostname / IP the devices use. Becomes the SAN of Caddy's internal
      # CA certificate for both the main and display virtual hosts.
      ALKAROS_PROXY_HOST: ${ALKAROS_PROXY_HOST:-localhost}
    ports:
      - "8443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://localhost/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

secrets:
  db_password:
    file: ./deploy/docker/db_password
  admin_password:
    file: ./deploy/docker/admin_password

volumes:
  alkaros-postgres:
  alkaros-wal-archive:
  caddy-data:
  caddy-config:

networks:
  default: {}
  # V12-QRT-005: joined by `api`, `postgres` and `connector` (see each
  # service's own `networks:` block) - `connector` is deliberately on ONLY
  # this network (not `default` too), since sharing two networks with the
  # same peer makes Docker's embedded DNS resolution of that peer's name
  # ambiguous (confirmed: it does not reliably return the `relay-internal`
  # address when a peer is reachable on both networks). NOT `internal:
  # true`: `cloudflared` (inside `connector`) needs real outbound internet
  # access to reach Cloudflare's edge - only inbound routing from outside
  # the host is what Docker already blocks for an unpublished-port bridge
  # network like this one, `internal: true` was never required for that.
  # A fixed subnet (rather than an auto-assigned one) is what
  # DualScreenOptions.NfcTrustedNetworks / compose's own
  # --nfc-trusted-network flag on `api` actually checks against, so it must
  # stay this exact value.
  relay-internal:
    ipam:
      config:
        - subnet: 172.28.90.0/28
