<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ALKAROS Menü</title>
  <link rel="stylesheet" href="./menu-app.css" />
</head>
<body>
  <header class="menu-header">
    <div class="menu-header-top">
      <h1>Menü</h1>
      <a class="bill-link" href="./bill.html">Adisyonum</a>
    </div>
    <nav id="categoryTabs" class="category-tabs" aria-label="Kategoriler"></nav>
  </header>

  <main id="menuMain">
    <p id="loadingState" class="state-message">Menü yükleniyor…</p>
    <p id="errorState" class="state-message state-error" hidden></p>
    <p id="emptyState" class="state-message" hidden>Şu anda listelenecek ürün bulunmuyor.</p>
    <ul id="productList" class="product-list" hidden></ul>
  </main>

  <!-- V12-CWB-002: cart summary bar - hidden until the cart holds at least
       one line (menu-app.js's own CartStore). Navigates to OrderEntry's own
       page, which reads the same sessionStorage cart. -->
  <a id="cartBar" class="cart-bar" href="./order-entry.html" hidden>
    <span id="cartBarCount"></span>
    <span id="cartBarTotal"></span>
    <span class="cart-bar-action">Sepetim</span>
  </a>

  <script src="./menu-app.js"></script>
</body>
</html>
