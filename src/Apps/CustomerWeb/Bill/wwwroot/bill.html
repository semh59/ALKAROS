<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ALKAROS Adisyonum</title>
  <link rel="stylesheet" href="./bill.css" />
</head>
<body>
  <header class="bill-header">
    <a class="back-link" href="./index.html">‹ Menüye dön</a>
    <!-- V1-SET-009: the business's own name/logo (V1-SET-007/008) — hidden
         until bill.js's loadBranding() finds either one set. -->
    <div id="businessBrand" class="business-brand" hidden>
      <img id="businessLogo" class="business-logo" alt="" hidden>
      <p id="businessName" class="business-name" hidden></p>
    </div>
    <h1>Adisyonum</h1>
    <p class="bill-live-note">Bu ekran canlı güncellenir, garsonu çağırmanıza gerek yok.</p>
  </header>

  <main id="billMain">
    <p id="loadingState" class="state-message">Adisyon yükleniyor…</p>
    <p id="errorState" class="state-message state-error" role="alert" hidden></p>
    <p id="emptyBillState" class="state-message" hidden>
      Henüz siparişiniz görünmüyor. <a href="./index.html">Menüden ürün ekleyin.</a>
    </p>

    <!-- V1-RMD-375 (module-by-module UI audit): the header's own copy
         promises "Bu ekran canlı güncellenir" (updates live, polled every
         few seconds by bill.js), but nothing here was ever announced to a
         screen reader - a customer using one had no way to know a new item
         or price change had landed. aria-atomic="false" matches Cashier's
         own ticket-lines precedent (Cashier.tsx) so only what actually
         changed is read, not the whole bill re-announced on every poll. -->
    <ul id="billList" class="bill-list" aria-live="polite" aria-atomic="false" hidden></ul>

    <div id="billSummary" class="bill-summary" role="status" aria-live="polite" hidden>
      <div class="bill-summary-row">
        <span>Ara toplam</span>
        <span id="billSubtotal"></span>
      </div>
      <div class="bill-summary-row">
        <span>KDV</span>
        <span id="billTax"></span>
      </div>
      <div class="bill-summary-row bill-summary-total">
        <span>Toplam</span>
        <span id="billTotal"></span>
      </div>
    </div>
  </main>

  <script src="./bill.js"></script>
</body>
</html>
