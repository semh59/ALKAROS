<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ALKAROS Garson">
  <title>ALKAROS Garson El Terminali (Waiter PWA)</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./waiter-app.css">
</head>
<body>

  <!--
    Icon sprite - line icons on a 24x24 grid, stroked with currentColor.
    Mirror of src/Clients/PosTerminal/src/design-system/Icon.tsx (finding F-8).
    Keep the two in sync. Used as <svg class="icon"><use href="#ico-NAME"/></svg>.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="ico-brand" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></symbol>
    <symbol id="ico-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></symbol>
    <symbol id="ico-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></symbol>
    <symbol id="ico-add" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
    <symbol id="ico-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></symbol>
    <symbol id="ico-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </svg>

  <!-- Top Navigation / Header -->
  <header class="app-header" role="banner">
    <div class="header-brand">
      <div class="header-logo">
        <span><svg class="icon" aria-hidden="true"><use href="#ico-brand"/></svg> ALKAROS</span>
      </div>
      <span class="header-badge">Garson PWA</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-icon" id="btnRefreshTables" title="Yenile" aria-label="Yenile"><svg class="icon" aria-hidden="true"><use href="#ico-refresh"/></svg></button>
      <button type="button" class="btn-icon" id="btnStaffProfile" title="Personel" aria-label="Personel"><svg class="icon" aria-hidden="true"><use href="#ico-user"/></svg></button>
    </div>
  </header>

  <!-- Network / Sync Ribbon -->
  <aside id="statusRibbon" class="status-ribbon online" role="status" aria-live="polite">
    <div>
      <span class="pulse-dot"></span>
      <span id="statusText">Çevrimiçi • Canlı Bağlantı</span>
    </div>
    <span id="queueCount"></span>
  </aside>

  <!-- Main View Container -->
  <main class="main-container" role="main">
    
    <!-- Zone Selection Pills -->
    <nav class="zone-scroll" id="zoneList" aria-label="Salon ve Bölge Seçimi">
      <!-- Injected by waiter-app.js -->
    </nav>

    <!-- Tables Grid -->
    <section class="tables-grid" id="tablesGrid" aria-label="Masalar">
      <!-- Injected by waiter-app.js -->
    </section>

  </main>

  <!-- Sticky Bottom Drawer (When Table Selected) -->
  <aside class="bottom-bar" id="orderDrawer" hidden role="region" aria-label="Seçili Masa Özeti">
    <div class="order-summary-pill">
      <span class="order-summary-table" id="selectedTableLabel">Masa: M-01</span>
      <span class="order-summary-items" id="cartItemCount">0 Ürün</span>
    </div>
    <button type="button" class="btn-primary" id="btnOpenOrderModal">
      <span><svg class="icon" aria-hidden="true"><use href="#ico-add"/></svg> Sipariş Ekle</span>
    </button>
  </aside>

  <!-- Modal: Order Entry & Catalog Picker -->
  <div class="modal-overlay" id="orderModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTableTitle">
    <div class="modal-content">
      
      <div class="modal-header">
        <h2 class="modal-title" id="modalTableTitle">Masa Sipariş Ekle</h2>
        <button type="button" class="btn-icon" id="btnCloseModal" aria-label="Kapat"><svg class="icon" aria-hidden="true"><use href="#ico-close"/></svg></button>
      </div>

      <div class="modal-body">
        <!-- Search -->
        <input type="search" class="search-input" id="modalProductSearch" placeholder="Ürün veya içecek ara..." autocomplete="off">

        <!-- Category Filters -->
        <div class="zone-scroll" id="categoryFilterBar">
          <!-- Injected by waiter-app.js -->
        </div>

        <!-- Product Grid -->
        <div class="product-grid product-grid--modal" id="productGrid">
          <!-- Injected by waiter-app.js -->
        </div>

        <!-- Active Cart Summary -->
        <h3 class="modal-subhead">Adisyon Kalemleri</h3>
        <div id="cartItemsList">
          <!-- Injected by waiter-app.js -->
        </div>
      </div>

      <!-- Modal Footer Action -->
      <div class="modal-foot">
        <div>
          <div class="modal-foot__label">Toplam Tutar</div>
          <div id="cartTotalAmount" class="modal-foot__total">0,00 ₺</div>
        </div>
        <button type="button" class="btn-success" id="btnSendKitchen">
          <span><svg class="icon" aria-hidden="true"><use href="#ico-send"/></svg> Mutfağa Gönder</span>
        </button>
      </div>

    </div>
  </div>

  <!-- Staff sign-in. Shown until the device holds a valid cashier session for
       its own terminal id; the header "Personel" button signs out. -->
  <div class="login-overlay" id="loginOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <form class="login-card" id="loginForm" novalidate>
      <div class="login-brand"><svg class="icon" aria-hidden="true"><use href="#ico-brand"/></svg> ALKAROS</div>
      <h1 id="loginTitle">Garson Girişi</h1>
      <p class="login-hint">Bu cihazı kasaya bağlamak için personel bilgilerinizle giriş yapın.</p>
      <label for="loginUsername">Kullanıcı adı
        <input type="text" id="loginUsername" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label for="loginPassword">Şifre
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
      </label>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button type="submit" class="btn-primary" id="loginSubmit">Giriş yap</button>
    </form>
  </div>

  <script src="./waiter-app.js"></script>
</body>
</html>
