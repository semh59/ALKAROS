<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>ALKAROS Hızlı Sipariş ve Kasa Terminali (Cashier POS)</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./cashier-app.css">
</head>
<body>

  <!-- Top Header / Session Bar -->
  <header class="pos-header" role="banner">
    <div class="pos-brand">
      <div class="pos-logo">
        <span>⚡ ALKAROS</span>
      </div>
      <span class="pos-badge">Hızlı Sipariş Girişi</span>
    </div>
    <div class="session-info-bar">
      <div class="session-pill">
        <span>👤</span>
        <span id="cashierNameLabel">Kasiyer</span>
      </div>
      <div class="session-pill">
        <span>🏪</span>
        <span id="registerLabel">KASA-01</span>
      </div>
      <div class="session-pill session-pill--online">
        <span>🟢 Çevrimiçi</span>
      </div>
    </div>
  </header>

  <!-- Split Workspace -->
  <div class="pos-main-split">

    <!-- Left: Product Matrix (60%) -->
    <section class="pos-catalog-panel" aria-label="Ürün Kataloğu ve Hızlı Satış">
      
      <!-- Top Search & Barcode -->
      <div class="catalog-top-bar">
        <input type="search" class="search-input" id="searchInput" placeholder="🔍 Barkod okutun veya ürün adı arayın..." autocomplete="off">
      </div>

      <!-- Category Filter Tabs -->
      <nav class="category-tabs" id="categoryTabs" aria-label="Ürün Kategorileri">
        <!-- Injected by cashier-app.js -->
      </nav>

      <!-- Fast Grid -->
      <div class="product-matrix" id="productMatrix" role="region" aria-label="Hızlı Ürünler">
        <!-- Injected by cashier-app.js -->
      </div>

    </section>

    <!-- Right: Active Ticket & Order Dispatch (40%) -->
    <aside class="pos-ticket-panel" aria-label="Aktif Fiş ve Sipariş İletimi">
      
      <!-- Ticket Header -->
      <div class="ticket-header">
        <span class="ticket-title">Aktif Taslak Fiş</span>
        <div class="ticket-actions-row">
          <button type="button" class="btn-ticket-action" id="btnParkTicket" title="Fişi Beklemeye Al">⏸️ Beklet</button>
          <button type="button" class="btn-ticket-action" id="btnRecallTicket" title="Bekleyen Fişler">📂 Fişler <span id="parkCountBadge"></span></button>
          <button type="button" class="btn-ticket-action btn-ticket-action--danger" id="btnClearTicket" title="Fişi Temizle">🗑️ İptal</button>
        </div>
      </div>

      <!-- Ticket Items Stream -->
      <div class="ticket-items-stream" id="ticketItemsStream" role="region" aria-label="Fiş Kalemleri">
        <!-- Injected by cashier-app.js -->
      </div>

      <!-- Totals & Dispatch Box -->
      <div class="pos-checkout-box">
        
        <div class="totals-row">
          <span class="grand-total-label">TASLAK TUTARI</span>
          <span class="grand-total-amount" id="grandTotalAmount">0,00 ₺</span>
        </div>

        <!-- Confirm and Dispatch to Kitchen Button -->
        <button type="button" class="btn-dispatch-order" id="btnDispatchOrder">
          <span>🚀 SİPARİŞİ ONAYLA & MUTFAĞA İLET</span>
        </button>

      </div>

    </aside>

  </div>

  <!-- Parked Tickets Modal -->
  <div class="modal-overlay" id="parkedModal" hidden role="dialog" aria-modal="true" aria-labelledby="parkedTitle">
    <div class="modal-card">
      <div class="modal-card__head">
        <h2 id="parkedTitle" class="modal-card__title">Bekleyen Fişler (Park)</h2>
        <button type="button" class="btn-ticket-action" id="btnCloseParkedModal">✕</button>
      </div>

      <div id="parkedList" class="modal-card__list">
        <!-- Injected by cashier-app.js -->
      </div>
    </div>
  </div>

  <script src="./cashier-app.js"></script>
</body>
</html>
