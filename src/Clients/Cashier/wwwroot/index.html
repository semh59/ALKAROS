<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>ALKAROS Hızlı Sipariş ve Kasa Terminali (Cashier POS)</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./cashier-app.css">
</head>
<body>

  <!--
    Icon sprite - line icons on a 24x24 grid, stroked with currentColor.
    Mirror of src/Clients/PosTerminal/src/design-system/Icon.tsx (finding F-8).
    Keep the two in sync. Used as <svg class="icon"><use href="#ico-NAME"/></svg>.
  -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true">
    <symbol id="ico-brand" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></symbol>
    <symbol id="ico-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></symbol>
    <symbol id="ico-register" viewBox="0 0 24 24"><path d="M4 9 5 4h14l1 5M4 9v11h16V9M9 20v-6h6v6M4 9h16"/></symbol>
    <symbol id="ico-pause" viewBox="0 0 24 24"><path d="M6 4h3v16H6zM15 4h3v16h-3z"/></symbol>
    <symbol id="ico-recall" viewBox="0 0 24 24"><path d="M6 14 7.5 11.1A2 2 0 0 1 9.3 10H20a2 2 0 0 1 1.9 2.5l-1.5 6A2 2 0 0 1 18.5 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2a2 2 0 0 0 1.7.9H18a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="ico-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></symbol>
    <symbol id="ico-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></symbol>
    <symbol id="ico-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="ico-gift" viewBox="0 0 24 24"><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8M2 8h20v4H2zM12 8v13M12 8 8.5 4.5a2.1 2.1 0 0 1 3-3L12 8l.5-6.5a2.1 2.1 0 0 1 3 3Z"/></symbol>
    <symbol id="ico-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></symbol>
    <symbol id="ico-add" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  </svg>

  <!-- Top Header / Session Bar -->
  <header class="pos-header" role="banner">
    <div class="pos-brand">
      <div class="pos-logo">
        <span><svg class="icon" aria-hidden="true"><use href="#ico-brand"/></svg> ALKAROS</span>
      </div>
      <span class="pos-badge">Hızlı Sipariş Girişi</span>
    </div>
    <div class="session-info-bar">
      <div class="session-pill">
        <svg class="icon" aria-hidden="true"><use href="#ico-user"/></svg>
        <span id="cashierNameLabel">Kasiyer</span>
      </div>
      <div class="session-pill">
        <svg class="icon" aria-hidden="true"><use href="#ico-register"/></svg>
        <span id="registerLabel">KASA-01</span>
      </div>
      <div class="session-pill session-pill--online" id="connectivityPill">
        <span><span class="status-dot" aria-hidden="true"></span><span id="connectivityLabel">Çevrimiçi</span></span>
      </div>
    </div>
  </header>

  <!-- Split Workspace -->
  <div class="pos-main-split">

    <!-- Left: Product Matrix (60%) -->
    <section class="pos-catalog-panel" aria-label="Ürün Kataloğu ve Hızlı Satış">
      
      <!-- Top Search & Barcode -->
      <div class="catalog-top-bar">
        <input type="search" class="search-input" id="searchInput" placeholder="Barkod okutun veya ürün adı arayın..." autocomplete="off">
      </div>

      <!-- Category Filter Tabs -->
      <nav class="category-tabs" id="categoryTabs" aria-label="Ürün Kategorileri">
        <!-- Injected by cashier-app.js -->
      </nav>

      <!-- Fast Grid -->
      <div class="product-matrix" id="productMatrix" role="region" aria-label="Hızlı Ürünler">
        <!-- Injected by cashier-app.js -->
      </div>

    </section>

    <!-- Right: Active Ticket & Order Dispatch (40%) -->
    <aside class="pos-ticket-panel" aria-label="Aktif Fiş ve Sipariş İletimi">
      
      <!-- Ticket Header -->
      <div class="ticket-header">
        <span class="ticket-title">Aktif Taslak Fiş</span>
        <div class="ticket-actions-row">
          <button type="button" class="btn-ticket-action" id="btnParkTicket" title="Fişi Beklemeye Al"><svg class="icon" aria-hidden="true"><use href="#ico-pause"/></svg> Beklet</button>
          <button type="button" class="btn-ticket-action" id="btnRecallTicket" title="Bekleyen Fişler"><svg class="icon" aria-hidden="true"><use href="#ico-recall"/></svg> Fişler <span id="parkCountBadge"></span></button>
          <button type="button" class="btn-ticket-action btn-ticket-action--danger" id="btnClearTicket" title="Fişi Temizle"><svg class="icon" aria-hidden="true"><use href="#ico-trash"/></svg> İptal</button>
        </div>
      </div>

      <!-- Ticket Items Stream -->
      <div class="ticket-items-stream" id="ticketItemsStream" role="region" aria-label="Fiş Kalemleri">
        <!-- Injected by cashier-app.js -->
      </div>

      <!-- Totals & Dispatch Box -->
      <div class="pos-checkout-box">
        
        <div class="totals-row">
          <span class="grand-total-label">TASLAK TUTARI</span>
          <span class="grand-total-amount" id="grandTotalAmount">0,00 ₺</span>
        </div>

        <!-- Confirm and Dispatch to Kitchen Button -->
        <button type="button" class="btn-dispatch-order" id="btnDispatchOrder">
          <span><svg class="icon" aria-hidden="true"><use href="#ico-send"/></svg> SİPARİŞİ ONAYLA &amp; MUTFAĞA İLET</span>
        </button>
        <div class="dispatch-hint" id="dispatchHint" hidden></div>

      </div>

    </aside>

  </div>

  <!-- Parked Tickets Modal -->
  <div class="modal-overlay" id="parkedModal" hidden role="dialog" aria-modal="true" aria-labelledby="parkedTitle">
    <div class="modal-card">
      <div class="modal-card__head">
        <h2 id="parkedTitle" class="modal-card__title">Bekleyen Fişler (Park)</h2>
        <button type="button" class="btn-ticket-action" id="btnCloseParkedModal" aria-label="Kapat"><svg class="icon" aria-hidden="true"><use href="#ico-close"/></svg></button>
      </div>

      <div id="parkedList" class="modal-card__list">
        <!-- Injected by cashier-app.js -->
      </div>
    </div>
  </div>

  <script src="./cashier-app.js"></script>
</body>
</html>
