# gitleaks configuration for the "Full Git history secret scan" CI step.
# Keeps every default rule; the allowlist below covers a handful of history
# matches that are demonstrably NOT secrets:
#   - test fixtures that carry a deliberately fake key so the code under test
#     has something key-shaped to redact / decrypt;
#   - SHA-256 content hashes recorded in evidence markdown, which the
#     generic-api-key regex reads as a 64-hex "key".

[extend]
useDefault = true

[[allowlists]]
description = "Deliberate test fixtures and evidence content hashes (no real secret)"
paths = [
  '''tests/Modules/Audit/EventStore/AuditSanitizerTests\.cs''',
  '''tests/BuildingBlocks/Security/SensitiveData/Fixtures/SensitiveDataFixtures\.cs''',
  '''evidence/V1-RMD-0(17|18)/validation\.md''',
  # RFC 8291 §5's own published Web Push encryption worked example
  # (public IETF test vectors, not a real key pair) plus plain string
  # idempotency-key test literals the generic-api-key rule's entropy
  # heuristic misreads as key material.
  '''tests/Host/Experience/WebPush/WebPushHttpTests\.cs''',
  '''tests/Host/Experience/WebPush/WebPushCryptoTests\.cs''',
  '''tests/Modules/Kitchen/PrintQueue/PostgresPrintQueueIntegrationTests\.cs''',
  '''tests/Modules/Inventory/WasteRecording/WasteRecordingDomainTests\.cs''',
  # Same reasoning, later additions: idempotency-key string literals, fake
  # bearer/JWT-shaped strings that the secret-pattern scanner tests must
  # detect, and a fake retention crypto key.
  '''tests/Host/Experience/PaymentTender/PaymentTenderHttpTests\.cs''',
  '''tests/Host/Experience/CashSession/CashSessionHttpTests\.cs''',
  '''tests/Host/Experience/WebPush/WebPushSenderTests\.cs''',
  '''tests/Modules/Support/DiagnosticBundle/(DiagnosticBundleService|SecretPatternScanner)Tests\.cs''',
  '''tests/Modules/Security/DataProtectionRetention/Fixtures/RetentionCryptoFixtures\.cs''',
  # TokenX Cloud's own public Postman documentation: its sample login
  # response carries an example (expired) access token, not a credential.
  '''evidence/v0/integrations/V0-HUG-001/tokenx-documentation\.postman_collection\.json''',
]
regexes = [
  # AES-256 test key: "0123456789abcdef0123456789abcdef" and its base64.
  '''0123456789abcdef0123456789abcdef''',
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''',
  # Fake API key used only to exercise the audit sanitizer.
  '''ak_live_abcdef123456''',
]
